<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARMS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

    
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">ARMS</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Dashboard</a>
            <a href="#">About</a>
        </nav>

        <button id="loginBtn">Login</button>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Hero Section -->
        <section class="hero">
            <h1>ARMS</h1>
            <h3>Automated Reputation Management System</h3>

            <p>
                A simple SaaS platform for managing your information.
            </p>

            <button id="getStartedBtn">
                Get Started
            </button>
        </section>


        <!-- Dashboard Preview -->
        <section class="dashboard">

            <h2>Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <h3>Users</h3>
                    <p id="userCount">0</p>
                </div>

                <div class="card">
                    <h3>Data</h3>
                    <p id="dataCount">0</p>
                </div>

                <div class="card">
                    <h3>Status</h3>
                    <p>Connected</p>
                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 ARMS (Automated Reputation Management System). All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
